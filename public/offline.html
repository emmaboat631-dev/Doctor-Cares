<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1E5EFF" />
  <title>You're offline · Doctor Cares</title>
  <style>
    :root {
      --brand:#1E5EFF; --ink:#0F172A; --muted:#64748B; --bg:#F5F7FB;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0B1120; --ink:#F8FAFC; --muted:#94A3B8; }
    }
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
    .wrap{max-width:24rem;padding:2rem 1.25rem;}
    .logo{width:128px;height:128px;margin:0 auto 16px;object-fit:contain;}
    h1{font-size:1.5rem;margin:0 0 .5rem;letter-spacing:-0.01em;}
    p{color:var(--muted);margin:0 0 1.5rem;line-height:1.5;}
    button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:0.75rem 1.25rem;
      font-weight:600;font-size:1rem;cursor:pointer;}
    button:hover{filter:brightness(0.95);}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/brand-illustration.png" alt="Doctor Cares" />
    <h1>You're offline</h1>
    <p>Doctor Cares needs a connection to load new appointments, messages, and drug information. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
