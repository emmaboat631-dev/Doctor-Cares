<!--
  Doctor Cares — Invite team member
  Paste into Supabase → Authentication → Emails → Templates → "Invite user"
  Subject: You've been invited to Doctor Cares
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You're invited · Doctor Cares</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,0.06);">
        <tr><td style="background:linear-gradient(135deg,#1E5EFF,#122F87);padding:32px;text-align:center;">
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
            <tr><td style="background:#fff;border-radius:18px;width:64px;height:64px;text-align:center;">
              <span style="font-size:26px;font-weight:800;color:#1E5EFF;line-height:64px;">DC</span>
            </td></tr>
          </table>
          <div style="color:#fff;font-size:20px;font-weight:700;margin-top:16px;">Doctor Cares</div>
        </td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;letter-spacing:-0.01em;">You've been invited 🎉</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#334155;">
            Someone has invited you to join Doctor Cares. Accept the invite below and set up your account in seconds.
          </p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto 24px;">
            <tr><td style="border-radius:14px;background:#1E5EFF;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:600;color:#fff;text-decoration:none;border-radius:14px;">
                Accept invitation &rarr;
              </a>
            </td></tr>
          </table>
          <p style="margin:0 0 8px;font-size:12px;color:#64748b;">Or paste this link:</p>
          <p style="margin:0;font-size:12px;color:#1E5EFF;word-break:break-all;">
            <a href="{{ .ConfirmationURL }}" style="color:#1E5EFF;">{{ .ConfirmationURL }}</a>
          </p>
        </td></tr>
        <tr><td style="padding:16px 32px 28px;text-align:center;">
          <p style="margin:0;font-size:11px;color:#94a3b8;">© Doctor Cares · Healthcare. Anytime. Anywhere.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
